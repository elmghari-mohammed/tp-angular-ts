<div class="actions">
  <input
    #taskName
    type="text"
    placeholder="Nom de la tâche"
    [value]="newTaskTitle()"
    (input)="newTaskTitle.set(taskName.value)"
    (keyup.enter)="addTask()"
  />
  <button (click)="addTask()" [disabled]="!newTaskTitle().trim()">Ajouter (update)</button>
  <button (click)="resetTasks()">Réinitialiser (set)</button>
  <button (click)="clearTasks()">Vider (set)</button>
</div>

@if (tasks().length === 0) {
  <p class="empty">Aucune tâche à afficher.</p>
} @else {
  <ul>
    @for (task of tasks(); track task.id) {
      <li>
        {{ task.title }}
        <button (click)="renameTask(task.id, 'Tâche renommée')">Renommer (update)</button>
        <button (click)="deleteTask(task.id)">Supprimer (update)</button>
      </li>
    }
  </ul>
}
